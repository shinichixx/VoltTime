name: VoltTime
options:
  bundleIdPrefix: com.ridhuan
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "58"
targets:
  VoltTime:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: TesLah
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleURLTypes:
          - CFBundleURLName: com.ridhuan.volttime
            CFBundleURLSchemes:
              - volttime
        UIFileSharingEnabled: true               # On My iPhone › VoltTime (old CSV backups are cleared from here)
        LSSupportsOpeningDocumentsInPlace: true  # open picked backup files in place
        VTReleaseDate: 24 Nov 2026
        UIAppFonts:                              # Albert Sans (SIL OFL), closest free match to the Tesla app's Universal Sans
          - AlbertSans-Light.ttf
          - AlbertSans-Regular.ttf
          - AlbertSans-Medium.ttf
          - AlbertSans-SemiBold.ttf
          - AlbertSans-Bold.ttf
        NSLocalNetworkUsageDescription: Connects to Home Assistant on your network, and in the car to the S3XY Commander's Wi-Fi to read the battery cells.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ridhuan.volttime
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_STYLE: Manual
